services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pckp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pckp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pckp}
      POSTGRES_DB: ${POSTGRES_DB:-pckp}
    ports:
      # Host port 5434: this machine already runs a native Postgres Windows
      # service on 5432, and a separate project's own pgvector container
      # (ai_news_db) on 5433 — both silently swallow connections meant for
      # this project's container instead of failing loudly. Check with
      # `netstat -ano | findstr :<port>` before ever changing this back.
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pckp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pckp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pckp_postgres_data:
