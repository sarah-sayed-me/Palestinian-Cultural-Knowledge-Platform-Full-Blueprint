# torch otherwise arrives only transitively (camel-tools, sentence-transformers)
# — [tool.uv.sources] below ONLY overrides a package's source when it's also a
# *direct* project dependency, so the explicit pin above is required, not
# decorative. Plain PyPI only publishes a CPU-only Windows wheel (the "+cpu"
# version suffix) — CUDA builds are only published on PyTorch's own index.
# This redirects torch specifically (via `explicit = true`, so nothing else
# resolves from here) to the cu130 index, matching this machine's driver
# (CUDA 13.0 max, RTX Ada). After editing this, run `uv lock` then `uv sync`.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
