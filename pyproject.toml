    "internetarchive>=5.9.0",
    "langdetect>=1.0.9",
    "langid>=1.1.6",
    "lxml>=6.1.1",
    "networkx>=3.6.0",
    "ollama>=0.6.0",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pgvector>=0.4.1",
    "psycopg2-binary>=2.9.12",
